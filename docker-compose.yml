version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: placer_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Bind mount to a project-local folder (physically on whatever drive
      # this project lives on — D: in this setup) rather than an opaque
      # Docker-managed volume. Keeps DB files visible/backup-able and out
      # of Docker's internal disk image. Ignored by git — see .gitignore.
      - ./mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placer_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
